name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Smoke test (real servers, real stop)
        run: npm run test:smoke
      - name: Docker smoke test (real container, docker stop)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:docker
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --no-dependencies
